<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eidos AGI company icon</title>
  <desc id="desc">The Eidos AGI trilogy-dot mark. The third dot is slightly off-center: alive, not static.</desc>
  <defs>
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="112" fill="#161210"/>
  <rect x="56" y="56" width="688" height="688" rx="82" fill="#1e1a17"/>
  <rect width="800" height="800" rx="112" filter="url(#n)" opacity="0.045"/>
  <!-- Three dots — the trilogy. Third is slightly off-center: alive, not static. -->
  <g transform="translate(400 383) rotate(-6) translate(-400 -383)">
    <circle cx="241" cy="398" r="72" fill="#d8a263"/>
    <circle cx="400" cy="398" r="72" fill="#c4935a"/>
    <circle cx="559" cy="369" r="72" fill="#c8d4ad"/>
  </g>
</svg>
