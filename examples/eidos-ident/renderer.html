<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Eidos AGI — ident</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("./assets/SpaceGrotesk-latin.woff2") format("woff2"),
           url("./assets/SpaceGrotesk-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("./assets/SpaceGrotesk-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("./assets/SpaceGrotesk-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
    }
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #161210;
      font-family: "Space Grotesk", sans-serif;
      color: #dcd5cb;
    }
    #c {
      position: fixed;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
    #type {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 96px;
      text-align: center;
      pointer-events: none;
      z-index: 4;
    }
    #word {
      font-weight: 700;
      font-size: 64px;
      letter-spacing: 0.16em;
      line-height: 1;
      color: #ede5d8;
      opacity: 0;
    }
    #word .agi {
      font-weight: 500;
      letter-spacing: 0.32em;
      color: #8b8179;
      padding-left: 0.35em;
    }
    #rule {
      width: 0;
      height: 2px;
      margin: 22px auto 18px;
      background: #d8a263;
      opacity: 0.95;
    }
    #lede {
      font-weight: 400;
      font-size: 24px;
      letter-spacing: 0.04em;
      color: #c4bbb0;
      opacity: 0;
    }
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(12,9,8,0.55) 100%);
    }
    #canopy {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 1;
    }
    #canopy .glass {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(12,9,8,0.72) 0%, rgba(12,9,8,0.0) 22%),
        linear-gradient(to bottom, rgba(18,14,12,0.28) 0%, transparent 14%);
    }
    #canopy .bow {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 7.2%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d8a263 12%, #d8a263 88%, transparent);
      opacity: 0.55;
    }
    #canopy .tick {
      position: absolute;
      bottom: 7.2%;
      width: 1px;
      height: 10px;
      background: #d8a263;
      opacity: 0.45;
    }
    #canopy .mass {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7.2%;
      background: #120e0c;
      box-shadow: 0 -18px 40px rgba(12,9,8,0.55);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="c"></div>
  <div id="vignette"></div>
  <div id="canopy">
    <div class="glass"></div>
    <div class="mass"></div>
    <div class="bow"></div>
    <div class="tick" style="left:18%"></div>
    <div class="tick" style="left:34%"></div>
    <div class="tick" style="left:50%;height:14px"></div>
    <div class="tick" style="left:66%"></div>
    <div class="tick" style="left:82%"></div>
  </div>
  <div id="type">
    <div id="word">Eidos<span class="agi">AGI</span></div>
    <div id="rule"></div>
    <div id="lede">Software for agents. Governance for reality.</div>
  </div>
  <div id="grain"></div>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";

    const spec = await fetch("./scene.json").then((r) => r.json());
    const W = spec.size[0], H = spec.size[1];
    const BG = 0x161210;
    const R = 1;

    const clamp01 = (x) => Math.max(0, Math.min(1, x));
    const smoother = (t) => {
      t = clamp01(t);
      return t * t * t * (t * (t * 6 - 15) + 10);
    };
    const lerp = (a, b, t) => a + (b - a) * t;
    const fade = (t, a, b, c, d) => {
      if (t < a || t > d) return 0;
      if (t < b) return smoother((t - a) / Math.max(1e-6, b - a));
      if (t < c) return 1;
      return 1 - smoother((t - c) / Math.max(1e-6, d - c));
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG);
    scene.fog = new THREE.FogExp2(BG, 0.028);

    const camera = new THREE.PerspectiveCamera(70, W / H, 0.08, 90);
    camera.position.set(1.2, 0.4, 14.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById("c").appendChild(renderer.domElement);
    Object.assign(renderer.domElement.style, { width: "1920px", height: "1080px", display: "block" });

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.12, 0.4, 0.9);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    RectAreaLightUniformsLib.init();
    const windowLight = new THREE.RectAreaLight(0xffd4a8, 0, 7.2, 4.2);
    windowLight.position.set(-4.2, 6.8, 5.4);
    windowLight.lookAt(0, 0.2, 0);
    scene.add(windowLight);

    const sagePanel = new THREE.RectAreaLight(0xc8d4ad, 0, 2.4, 3.6);
    sagePanel.position.set(5.6, 2.2, 3.2);
    sagePanel.lookAt(0, 0.2, 0);
    scene.add(sagePanel);

    // Workshop lamp — warm, casts the contact shadows the area lights can't.
    const key = new THREE.SpotLight(0xffd2a0, 0, 28, 0.48, 0.82, 1.35);
    key.position.set(-5.2, 9.4, 6.2);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.00015;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 28;
    scene.add(key);
    scene.add(key.target);

    const rim = new THREE.DirectionalLight(0x8fa385, 0);
    rim.position.set(7.5, 2.4, -5.5);
    scene.add(rim);

    const brassFill = new THREE.PointLight(0xd8a263, 0, 16, 2);
    brassFill.position.set(1.6, 1.4, 3.4);
    scene.add(brassFill);

    const bounce = new THREE.HemisphereLight(0x3a322c, 0x0c0a09, 0.28);
    scene.add(bounce);

    // Cheap workshop IBL: a warm window + dark walls so brass has something to chew.
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x120e0c);
    const win = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 5),
      new THREE.MeshBasicMaterial({ color: 0xffe1b8 })
    );
    win.position.set(-6, 4, 8);
    win.lookAt(0, 0, 0);
    envScene.add(win);
    const strip = new THREE.Mesh(
      new THREE.PlaneGeometry(2.2, 6),
      new THREE.MeshBasicMaterial({ color: 0xc8d4ad })
    );
    strip.position.set(7, 1.5, 4);
    strip.lookAt(0, 0, 0);
    envScene.add(strip);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(envScene, 0.06).texture;
    scene.environmentIntensity = 0.55;

    const group = new THREE.Group();
    scene.add(group);

    const geo = new THREE.SphereGeometry(R, 128, 96);

    const brassL = new THREE.MeshPhysicalMaterial({
      color: 0xd8a263,
      metalness: 1,
      roughness: 0.18,
      envMapIntensity: 1.15,
      specularIntensity: 1,
    });
    const brassM = new THREE.MeshPhysicalMaterial({
      color: 0xc4935a,
      metalness: 1,
      roughness: 0.26,
      envMapIntensity: 1.05,
    });
    const sage = new THREE.MeshPhysicalMaterial({
      color: 0x9aaf88,
      metalness: 0.04,
      roughness: 0.32,
      clearcoat: 0.4,
      clearcoatRoughness: 0.22,
      sheen: 0.35,
      sheenRoughness: 0.45,
      sheenColor: new THREE.Color(0xc8d4ad),
      envMapIntensity: 0.45,
    });

    const mats = { "brass-light": brassL, brass: brassM, sage: sage };
    const spheres = {};
    for (const o of spec.objects) {
      if (o.kind !== "sphere") continue;
      const mesh = new THREE.Mesh(geo, mats[o.material] || brassM);
      mesh.position.fromArray(o.position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      spheres[o.id] = mesh;
    }
    const sR = spheres.right;
    const sageSpec = spec.objects.find((o) => o.id === "right") || { position: [0, 0, 0] };
    const RIGHT_Y = sageSpec.position[1];
    const sageHasKeys = Array.isArray(sageSpec.keys) && sageSpec.keys.length > 0;

    function poseOfKey(k, fallback) {
      const pos = (k && k.position) ? k.position : (fallback.position || [0, 0, 0]);
      const scale = (k && k.scale != null) ? k.scale : (fallback.scale != null ? fallback.scale : 1);
      return { pos: pos.slice(), scale };
    }
    function sampleObj(obj, t) {
      const ks = obj.keys;
      if (!ks || !ks.length) {
        return {
          pos: (obj.position || [0, 0, 0]).slice(),
          scale: obj.scale != null ? obj.scale : 1,
        };
      }
      if (t <= ks[0].t) return poseOfKey(ks[0], obj);
      const last = ks[ks.length - 1];
      if (t >= last.t) return poseOfKey(last, obj);
      let i = 0;
      while (i < ks.length - 1 && t > ks[i + 1].t) i++;
      const a = ks[i], b = ks[i + 1];
      const u = (t - a.t) / Math.max(1e-6, b.t - a.t);
      const pa = a.position, pb = b.position;
      const sa = a.scale != null ? a.scale : 1;
      const sb = b.scale != null ? b.scale : 1;
      return {
        pos: [lerp(pa[0], pb[0], u), lerp(pa[1], pb[1], u), lerp(pa[2], pb[2], u)],
        scale: lerp(sa, sb, u),
      };
    }
    function applyObjectKeys(t) {
      for (const o of spec.objects) {
        if (o.kind !== "sphere") continue;
        const mesh = spheres[o.id];
        if (!mesh) continue;
        const pose = sampleObj(o, t);
        mesh.position.fromArray(pose.pos);
        mesh.scale.setScalar(pose.scale);
        mesh.visible = pose.scale > 0.02;
      }
    }
    function sampleGroup(t) {
      const g = spec.group || {};
      const ks = g.keys;
      const z0 = g.rotation_z_deg || 0;
      if (!ks || !ks.length) return { y: 0, z: z0 };
      const yOf = (k) => (k.rotation_y_deg != null ? k.rotation_y_deg : 0);
      const zOf = (k) => (k.rotation_z_deg != null ? k.rotation_z_deg : z0);
      if (t <= ks[0].t) return { y: yOf(ks[0]), z: zOf(ks[0]) };
      const last = ks[ks.length - 1];
      if (t >= last.t) return { y: yOf(last), z: zOf(last) };
      let i = 0;
      while (i < ks.length - 1 && t > ks[i + 1].t) i++;
      const a = ks[i], b = ks[i + 1];
      const u = (t - a.t) / Math.max(1e-6, b.t - a.t);
      return { y: lerp(yOf(a), yOf(b), u), z: lerp(zOf(a), zOf(b), u) };
    }
    window.__objectPose = (id) => {
      const m = spheres[id];
      if (!m) return null;
      return { x: m.position.x, y: m.position.y, z: m.position.z, scale: m.scale.x };
    };
    const _world = new THREE.Vector3();
    window.__objectWorldPose = (id) => {
      const m = spheres[id];
      if (!m) return null;
      group.updateMatrixWorld(true);
      m.getWorldPosition(_world);
      return { x: _world.x, y: _world.y, z: _world.z, scale: m.scale.x };
    };

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0x0b0908, roughness: 0.94, metalness: 0.03,
        transparent: true, opacity: 0, depthWrite: false,
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.02;
    floor.receiveShadow = true;
    floor.visible = false;
    scene.add(floor);

    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const acc = spec.accretion || {};
    const road = spec.road || {};
    const ROAD = road.samples || [];
    const LANE_X = road.lane_x || [-0.95, 0, 0.95];
    const ROAD_W = road.width || 2.55;
    const ACC_N = acc.n || 0;
    const DOT_R = acc.dot_r || 0.14;
    const rng = mulberry32((acc.seed || 1) >>> 0);
    const accParts = [];
    const C_BRASS = new THREE.Color(0xd8a263);
    const C_DARK = new THREE.Color(0xc4935a);
    const C_SAGE = new THREE.Color(0xc8d4ad);
    const PHI = Math.PI * (3 - Math.sqrt(5));
    const sMax = ROAD.length ? ROAD[ROAD.length - 1].s : 38;
    const nGem = 240;
    for (let i = 0; i < ACC_N; i++) {
      const gem = i < nGem;
      const lane = gem ? (i % 3) : Math.floor(rng() * 3);
      const s = gem
        ? (Math.floor(i / 3) + 0.15) * (sMax / Math.max(1, nGem / 3))
        : rng() * sMax;
      const fy = 1 - (i / Math.max(1, ACC_N - 1)) * 2;
      const fth = PHI * i;
      accParts.push({
        s, lane, gem,
        sz: gem ? 1.35 + rng() * 0.25 : 0.38 + rng() * 0.22,
        tint: lane === 2 ? 2 : (lane === 0 ? 0 : 1),
        fth, ty: fy,
        jitter: gem ? (rng() - 0.5) * 0.06 : (rng() - 0.5) * 0.55,
      });
    }
    function sampleRoad(s) {
      if (!ROAD.length) {
        return { p: [0, 0.5, 0], t: [0, 0, -1], r: [1, 0, 0], u: [0, 1, 0] };
      }
      if (s <= ROAD[0].s) return ROAD[0];
      const last = ROAD[ROAD.length - 1];
      if (s >= last.s) return last;
      let lo = 0, hi = ROAD.length - 1;
      while (hi - lo > 1) {
        const m = (lo + hi) >> 1;
        if (ROAD[m].s < s) lo = m; else hi = m;
      }
      const a = ROAD[lo], b = ROAD[hi];
      const u = (s - a.s) / Math.max(1e-6, b.s - a.s);
      const mix = (pa, pb) => [lerp(pa[0], pb[0], u), lerp(pa[1], pb[1], u), lerp(pa[2], pb[2], u)];
      return { p: mix(a.p, b.p), t: mix(a.t, b.t), r: mix(a.r, b.r), u: mix(a.u, b.u) };
    }
    if (ROAD.length > 1) {
      const pos = [];
      const col = [];
      const cEdge = new THREE.Color(0x2a221c);
      const cLane = new THREE.Color(0x6a4e32);
      const half = ROAD_W * 0.5;
      for (let i = 0; i < ROAD.length; i++) {
        const sm = ROAD[i];
        const lx = sm.p[0] - sm.r[0] * half, ly = sm.p[1] - sm.r[1] * half, lz = sm.p[2] - sm.r[2] * half;
        const rx = sm.p[0] + sm.r[0] * half, ry = sm.p[1] + sm.r[1] * half, rz = sm.p[2] + sm.r[2] * half;
        pos.push(lx, ly, lz, rx, ry, rz);
        col.push(cEdge.r, cEdge.g, cEdge.b, cLane.r, cLane.g, cLane.b);
      }
      const idx = [];
      for (let i = 0; i < ROAD.length - 1; i++) {
        const a = i * 2;
        idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
      const ribbonGeo = new THREE.BufferGeometry();
      ribbonGeo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      ribbonGeo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
      ribbonGeo.setIndex(idx);
      ribbonGeo.computeVertexNormals();
      const ribbon = new THREE.Mesh(
        ribbonGeo,
        new THREE.MeshBasicMaterial({
          vertexColors: true,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.72,
          depthWrite: false,
        })
      );
      ribbon.frustumCulled = false;
      scene.add(ribbon);
      window.__ribbon = ribbon;
    }
    const circleGeo = new THREE.CircleGeometry(DOT_R, 24);
    const circleMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 1,
      depthWrite: true,
    });
    const accMesh = new THREE.InstancedMesh(circleGeo, circleMat, Math.max(1, ACC_N));
    accMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    accMesh.frustumCulled = false;
    const accDummy = new THREE.Object3D();
    const accColor = new THREE.Color();
    const TINTS = [C_BRASS, C_DARK, C_SAGE];
    for (let i = 0; i < ACC_N; i++) {
      accMesh.setColorAt(i, accColor.copy(TINTS[accParts[i].tint]));
    }
    if (accMesh.instanceColor) accMesh.instanceColor.needsUpdate = true;
    scene.add(accMesh);

    const DUST_N = 280;
    const dustPos = new Float32Array(DUST_N * 3);
    const dustBase = [];
    for (let i = 0; i < DUST_N; i++) {
      const x = (Math.random() - 0.5) * 7;
      const y = Math.random() * 2.8;
      const z = (Math.random() - 0.4) * 8;
      dustPos[i * 3] = x; dustPos[i * 3 + 1] = y; dustPos[i * 3 + 2] = z;
      dustBase.push({ x, y, z, p: Math.random() * Math.PI * 2, s: 0.12 + Math.random() * 0.22 });
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(
      dustGeo,
      new THREE.PointsMaterial({
        color: 0xe6d3b3,
        size: 0.022,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        sizeAttenuation: true,
      })
    );
    scene.add(dust);

    function applyAccretion(t, yawRad) {
      if (!ACC_N) { accMesh.visible = false; return; }
      const morphT = acc.morph || 7.0;
      const coalT = acc.coalesce || 11.8;
      const goneT = acc.gone || 12.1;
      const rs0 = acc.shell_r0 || 2.8;
      const rs1 = acc.shell_r1 || 1.02;
      const st0 = acc.shell_t0 || 8.2;
      const st1 = acc.shell_t1 || 12.0;
      const Rs = lerp(rs0, rs1, smoother((t - st0) / Math.max(0.05, st1 - st0)));
      const yaw = yawRad || 0;
      const planeY = 0.16;
      const uCoal = smoother((t - coalT) / Math.max(0.05, goneT - coalT));
      const appear = 0.3 + 0.7 * Math.min(1, t / 0.4);
      const fade = appear * (1 - uCoal);
      accMesh.material.opacity = fade;
      accMesh.visible = fade > 0.02;
      if (window.__ribbon) {
        window.__ribbon.material.opacity = 0.72 * fade * (1 - smoother((t - 9.2) / 2.2));
        window.__ribbon.visible = window.__ribbon.material.opacity > 0.03;
      }
      const morphSpan = Math.max(0.4, coalT - morphT);
      const beat = Math.pow(Math.max(0, Math.sin(t * 7.4)), 8);
      const swell = 0.12 + 0.55 * smoother((t - 6.5) / 4.8);
      const dump = 1 + 0.3 * smoother((t - 11.4) / 0.5) * (1 - smoother((t - 11.9) / 0.2));
      for (let i = 0; i < ACC_N; i++) {
        const p = accParts[i];
        const rd = sampleRoad(p.s);
        const lx = LANE_X[p.lane] + p.jitter;
        const ly = p.lane === 2 ? 0.16 : 0.02;
        let x = rd.p[0] + rd.r[0] * lx + rd.u[0] * (0.14 + ly);
        let y = rd.p[1] + rd.r[1] * lx + rd.u[1] * (0.14 + ly);
        let z = rd.p[2] + rd.r[2] * lx + rd.u[2] * (0.14 + ly);
        const uMorph = smoother((t - morphT - 0.35 * morphSpan * (p.s / sMax)) / (morphSpan * 0.55));
        const latS = Math.acos(Math.max(-1, Math.min(1, p.ty)));
        const sl = Math.sin(latS), cl = Math.cos(latS);
        const sx = Rs * sl * Math.cos(p.fth + yaw);
        const sy = planeY + Rs * cl;
        const sz = Rs * sl * Math.sin(p.fth + yaw);
        x = lerp(x, sx, uMorph);
        y = lerp(y, sy, uMorph);
        z = lerp(z, sz, uMorph);
        accDummy.position.set(x, y, z);
        const dCam = accDummy.position.distanceTo(camera.position);
        const near = clamp01((dCam - 0.35) / 1.05);
        const pulse = p.gem ? 1 + swell * beat * 0.85 : 1 + swell * beat * 0.18;
        const rad = lerp(DOT_R * p.sz * pulse, DOT_R * 0.32, Math.max(uMorph, uCoal)) * near * near;
        const relx = rd.t[0] * 4 - _camVel.x;
        const rely = rd.t[1] * 4 - _camVel.y;
        const relz = rd.t[2] * 4 - _camVel.z;
        const relLen = Math.hypot(relx, rely, relz);
        const toX = camera.position.x - x, toY = camera.position.y - y, toZ = camera.position.z - z;
        const toL = Math.hypot(toX, toY, toZ) || 1;
        const approach = (relx * toX + rely * toY + relz * toZ) / toL;
        const boost = 1 + 0.35 * Math.max(-0.4, Math.min(1, approach / 8));
        accMesh.setColorAt(i, accColor.copy(TINTS[p.tint]).multiplyScalar(boost * dump * (0.82 + 0.35 * pulse)));
        const stretch = 1 + Math.min(1.25, relLen * 0.08) * (1 - Math.max(uMorph, uCoal));
        if (relLen > 0.3) accDummy.up.set(relx, rely, relz);
        else accDummy.up.set(0, 1, 0);
        accDummy.lookAt(camera.position);
        const sc = Math.max(1e-4, rad / DOT_R);
        accDummy.scale.set(sc, sc * stretch, sc);
        accDummy.updateMatrix();
        accMesh.setMatrixAt(i, accDummy.matrix);
      }
      accMesh.instanceMatrix.needsUpdate = true;
      if (accMesh.instanceColor) accMesh.instanceColor.needsUpdate = true;
    }

    const word = document.getElementById("word");
    const lede = document.getElementById("lede");
    const rule = document.getElementById("rule");
    const wordSpec0 = (spec.type || []).find((x) => x.id === "word");
    const ledeSpec0 = (spec.type || []).find((x) => x.id === "lede");
    if (wordSpec0 && wordSpec0.text) {
      const bits = wordSpec0.text.split(/\s+/);
      word.innerHTML = bits[0] + (bits[1] ? `<span class="agi">${bits[1]}</span>` : "");
    }
    if (ledeSpec0 && ledeSpec0.text) lede.textContent = ledeSpec0.text;

    const keys = spec.camera.keys;

    function cm(p0, p1, p2, p3, u) {
      const u2 = u * u, u3 = u2 * u;
      return p0.map((_, i) =>
        0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * u +
          (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * u2 +
          (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * u3));
    }
    function keyAt(i) {
      const n = keys.length;
      return keys[Math.max(0, Math.min(n - 1, i))];
    }
    function sampleKeys(t) {
      if (t <= keys[0].t) {
        const k = keys[0];
        return { ...k, pos: k.pos.slice(), look: k.look.slice(), vel: (k.vel || [0, 0, 0]).slice() };
      }
      if (t >= keys[keys.length - 1].t) {
        const k = keys[keys.length - 1];
        return { ...k, pos: k.pos.slice(), look: k.look.slice(), vel: (k.vel || [0, 0, 0]).slice() };
      }
      let i = 0;
      while (i < keys.length - 1 && t > keys[i + 1].t) i++;
      const a = keys[i], b = keys[i + 1];
      const u = (t - a.t) / (b.t - a.t);
      const p0 = keyAt(i - 1), p1 = a, p2 = b, p3 = keyAt(i + 2);
      const va = a.vel || [0, 0, 0];
      const vb = b.vel || [0, 0, 0];
      return {
        pos: cm(p0.pos, p1.pos, p2.pos, p3.pos, u),
        look: cm(p0.look, p1.look, p2.look, p3.look, u),
        fov: lerp(a.fov, b.fov, u),
        roll: lerp(a.roll || 0, b.roll || 0, u),
        vel: [lerp(va[0], vb[0], u), lerp(va[1], vb[1], u), lerp(va[2], vb[2], u)],
      };
    }

    const _look = new THREE.Vector3();
    const _camVel = new THREE.Vector3();
    const canopyEl = document.getElementById("canopy");
    function seek(t) {
      const cam = sampleKeys(t);
      camera.position.set(cam.pos[0], cam.pos[1], cam.pos[2]);
      const cv = cam.vel || [0, 0, 0];
      _camVel.set(cv[0], cv[1], cv[2]);
      _look.set(cam.look[0], cam.look[1], cam.look[2]);
      camera.up.set(0, 1, 0);
      camera.lookAt(_look);
      camera.rotateZ(THREE.MathUtils.degToRad(cam.roll || 0));
      camera.fov = cam.fov;
      camera.updateProjectionMatrix();

      const lightOn = lerp(0.55, 1, smoother((t - 10.6) / 2.2));
      key.intensity = 180 * lightOn;
      key.target.position.set(0.2, 0.2, 0);
      key.target.updateMatrixWorld();
      windowLight.intensity = 18 * lightOn;
      sagePanel.intensity = 7.5 * lightOn;
      rim.intensity = 2.1 * lightOn;
      brassFill.intensity = 10 * lightOn;
      renderer.toneMappingExposure = lerp(0.78, 0.98, smoother((t - 10.0) / 3.0));
      bloom.strength = lerp(0.34, 0.10, smoother((t - 10.5) / 3.0));
      scene.fog.density = lerp(0.030, 0.010, smoother((t - 9.5) / 3.5));
      const floorOn = smoother((t - 11.0) / 2.2);
      floor.material.opacity = floorOn;
      floor.material.depthWrite = floorOn > 0.4;
      floor.visible = floorOn > 0.04;

      const gpose = sampleGroup(t);
      group.rotation.y = THREE.MathUtils.degToRad(gpose.y);
      group.rotation.z = THREE.MathUtils.degToRad(gpose.z);
      applyObjectKeys(t);
      applyAccretion(t, THREE.MathUtils.degToRad(gpose.y));
      // Praxis micro-bob only when sage has no keys — keys are authority.
      if (sR && !sageHasKeys) sR.position.y = RIGHT_Y + Math.sin(t * 1.15) * 0.028;

      dust.material.opacity = 0.14 * lightOn * smoother((t - 12.0) / 2.5);
      const attr = dust.geometry.attributes.position;
      for (let i = 0; i < DUST_N; i++) {
        const b = dustBase[i];
        attr.array[i * 3]     = b.x + Math.sin(t * b.s + b.p) * 0.12;
        attr.array[i * 3 + 1] = b.y + (t * 0.07 * b.s) % 8 - 0.5;
        attr.array[i * 3 + 2] = b.z + Math.cos(t * b.s * 0.8 + b.p) * 0.08;
      }
      attr.needsUpdate = true;

      const wordSpec = (spec.type || []).find((x) => x.id === "word");
      const ledeSpec = (spec.type || []).find((x) => x.id === "lede");
      if (wordSpec) word.style.opacity = String(fade(t, wordSpec.in, wordSpec.full, 99, 99));
      const ruleT = wordSpec ? fade(t, wordSpec.in + 0.6, wordSpec.full + 0.6, 99, 99) : 0;
      rule.style.opacity = String(ruleT);
      rule.style.width = `${Math.round(ruleT * 188)}px`;
      if (ledeSpec) lede.style.opacity = String(fade(t, ledeSpec.in, ledeSpec.full, 99, 99));
      if (canopyEl) canopyEl.style.opacity = String(1 - smoother((t - 10.4) / 1.8));

      composer.render();
    }

    window.__seek = seek;
    window.__duration = spec.duration;
    seek(0);
    document.fonts.ready.then(() => {
      seek(0);
      window.__ready = true;
    });
    window.__ready = false;
    setTimeout(() => { window.__ready = true; }, 1200);
  </script>
</body>
</html>
