<body class="share">
  <header class="bar">
    <a class="brand" href="/">
      <img src="/logo.svg" width="36" height="36" alt="Eidos AGI">
      <span>Eidos AGI</span>
    </a>
    <a class="more" href="/">Full reel</a>
  </header>

  <div class="pitch">
    <h1>160,000× cheaper than Grok Imagine.</h1>
  </div>

  <div class="film" id="v6">
    <div class="stage">
      <video id="ident" muted autoplay loop playsinline webkit-playsinline preload="auto" poster="/poster-v5.jpg" width="1920" height="1080">
        <source src="/ident-v5.mp4" type="video/mp4">
      </video>
      <button class="play" id="go" type="button" aria-label="Play from the start with sound">
        <span>Play</span>
        <div class="hint">Tap for sound</div>
      </button>
      <div class="veil" aria-hidden="true"></div>
    </div>
  </div>

  <script src="/play.js?v=1"></script>
