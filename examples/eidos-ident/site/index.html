<!doctype html>
<html lang="en" data-palette="ink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eidos ident v5</title>
  <meta name="description" content="Eidos AGI ident, log-spiral cut. Sixteen seconds.">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="canonical" href="https://video.eidosagi.com/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./og.jpg">

  <meta property="og:site_name" content="Eidos AGI">
  <meta property="og:title" content="Eidos ident v5">
  <meta property="og:description" content="Sixteen seconds. Log spiral into the mark.">
  <meta property="og:type" content="video.other">
  <meta property="og:url" content="https://video.eidosagi.com/">
  <meta property="og:image" content="https://video.eidosagi.com/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:video" content="https://video.eidosagi.com/ident-v5.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1920">
  <meta property="og:video:height" content="1080">
  <meta name="twitter:card" content="player">
  <meta name="twitter:title" content="Eidos ident v5">
  <meta name="twitter:image" content="https://video.eidosagi.com/og.jpg">
  <meta name="twitter:player" content="https://video.eidosagi.com/">
  <meta name="twitter:player:width" content="1280">
  <meta name="twitter:player:height" content="720">

  <link rel="stylesheet" href="./brand.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0c0b0a;
      color: var(--ink, #f0ebe4);
      font: 400 16px/1.4 var(--sans);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(0.75rem + env(safe-area-inset-top, 0px))
        calc(0.75rem + env(safe-area-inset-right, 0px))
        calc(0.75rem + env(safe-area-inset-bottom, 0px))
        calc(0.75rem + env(safe-area-inset-left, 0px));
    }
    .rail {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-shrink: 0;
      padding: 0.15rem 0.25rem 0.85rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 44px;
    }
    .brand img { width: 28px; height: 28px; border-radius: 6px; }
    .cut {
      font: 500 0.8rem/1 var(--mono, ui-monospace, monospace);
      color: var(--ink-soft, #8a8078);
      letter-spacing: 0.04em;
    }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100dvh - 5.5rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
      vertical-align: middle;
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .rail { display: none; }
      body { padding: 0; }
      .stage { border-radius: 0; min-height: 100dvh; }
      video { max-height: 100dvh; height: 100dvh; width: 100%; }
    }
    .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, #000 28%, transparent);
      border: 0;
      cursor: pointer;
      color: #faf5ec;
      padding: 0;
    }
    .play[hidden] { display: none; }
    .play span {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #9a6d35;
      color: #faf5ec;
      display: grid;
      place-items: center;
      font-size: 0;
      box-shadow: 0 8px 28px color-mix(in srgb, #000 45%, transparent);
    }
    .play span::before {
      content: "";
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 14px 0 14px 24px;
      border-color: transparent transparent transparent #faf5ec;
      margin-left: 4px;
    }
    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 0.8rem;
      color: #f0ebe4;
      text-shadow: 0 1px 8px #000;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      video { /* still playable; no autoplay */ }
    }
  </style>
</head>
<body>
  <header class="rail">
    <a class="brand" href="https://eidosagi.com/">
      <img src="./favicon.svg" alt="">
      Eidos
    </a>
    <span class="cut">ident v5 · 16s</span>
  </header>
  <main class="stage">
    <video
      id="ident"
      playsinline
      webkit-playsinline
      controls
      preload="metadata"
      poster="./poster.jpg"
      width="1920"
      height="1080"
      controlslist="nodownload"
    >
      <source src="./ident-v5.mp4" type="video/mp4">
    </video>
    <button class="play" id="go" type="button" aria-label="Play ident">
      <span>Play</span>
      <div class="hint">Tap to play with sound</div>
    </button>
  </main>
  <script>
    const v = document.getElementById("ident");
    const go = document.getElementById("go");
    function hide() { go.hidden = true; }
    function show() { if (v.paused) go.hidden = false; }
    go.addEventListener("click", async () => {
      v.muted = false;
      try { await v.play(); hide(); } catch (e) { v.controls = true; }
    });
    v.addEventListener("play", hide);
    v.addEventListener("pause", show);
    v.addEventListener("ended", show);
  </script>
</body>
</html>
